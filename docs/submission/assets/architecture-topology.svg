<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Swarm Brain topology: heterogeneous agent harnesses to stdio MCP bridges to HTTP API to application services to CockroachDB, with a fenced durable worker driving the vector plane">
  <title>Swarm Brain — swarm topology</title>
  <style>
    .bg    { fill: #0d1117; }
    .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .chip  { fill: #1c2128; stroke: #3d444d; stroke-width: 2; }
    .db    { fill: #12212b; stroke: #2f6f8f; stroke-width: 3; }
    .grp   { fill: #11161d; stroke: #30363d; stroke-width: 2; stroke-dasharray: 6 6; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .h1    { fill: #e6edf3; font-size: 46px; font-weight: 700; }
    .h1s   { fill: #8b949e; font-size: 27px; }
    .dbh   { fill: #e6edf3; font-size: 50px; font-weight: 700; }
    .box-h { fill: #e6edf3; font-size: 32px; font-weight: 600; }
    .box-b { fill: #a9b4c0; font-size: 25px; }
    .chp   { fill: #e6edf3; font-size: 28px; font-weight: 500; }
    .grph  { fill: #7d8590; font-size: 24px; font-weight: 600; letter-spacing: 2px; }
    .edge  { fill: #6e9fd0; font-size: 24px; }
    .edgeg { fill: #57ab68; font-size: 24px; }
    .item  { fill: #e6edf3; font-size: 28px; font-weight: 600; }
    .itemb { fill: #8b949e; font-size: 25px; }
    .foot  { fill: #6e7681; font-size: 24px; }
    .arrow { stroke: #58a6ff; stroke-width: 3; fill: none; }
    .arrow2{ stroke: #3fb950; stroke-width: 3; fill: none; }
    .thin  { stroke: #3d444d; stroke-width: 2; fill: none; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="h1" x="50" y="62">Swarm Brain — swarm topology</text>
  <text class="h1s" x="50" y="102">Many vendors' agents. One durable brain.</text>

  <!-- Harnesses -->
  <rect class="grp" x="50" y="140" width="370" height="352" rx="14"/>
  <text class="grph" x="72" y="180">HETEROGENEOUS HARNESSES</text>
  <rect class="chip" x="72" y="210" width="326" height="58" rx="8"/>
  <text class="chp" x="94" y="248">Claude Code</text>
  <rect class="chip" x="72" y="278" width="326" height="58" rx="8"/>
  <text class="chp" x="94" y="316">Codex CLI</text>
  <rect class="chip" x="72" y="346" width="326" height="58" rx="8"/>
  <text class="chp" x="94" y="384">Gemini CLI</text>
  <rect class="chip" x="72" y="414" width="326" height="58" rx="8"/>
  <text class="chp" x="94" y="452">OpenCode / local Qwen</text>

  <path class="thin" d="M398,239 L440,239 L440,443 L398,443"/>
  <path class="thin" d="M398,307 L440,307"/>
  <path class="thin" d="M398,375 L440,375"/>
  <path class="arrow" d="M440,335 L474,335" marker-end="url(#ah)"/>

  <!-- MCP bridges -->
  <rect class="panel" x="480" y="250" width="310" height="170" rx="14"/>
  <text class="box-h" x="504" y="300">stdio MCP bridge</text>
  <text class="box-b mono" x="504" y="340">swarmbrain-mcp</text>
  <text class="box-b" x="504" y="374">nine model-visible</text>
  <text class="box-b" x="504" y="404">tools per harness</text>

  <path class="arrow" d="M790,335 L844,335" marker-end="url(#ah)"/>

  <!-- HTTP API -->
  <rect class="panel" x="850" y="250" width="310" height="170" rx="14"/>
  <text class="box-h" x="874" y="300">HTTP API</text>
  <text class="box-b mono" x="874" y="340">swarmbrain-api</text>
  <text class="box-b" x="874" y="374">FastAPI · Pydantic v2</text>
  <text class="box-b" x="874" y="404">token to ActorContext</text>

  <path class="arrow" d="M1160,335 L1214,335" marker-end="url(#ah)"/>

  <!-- Application services -->
  <rect class="panel" x="1220" y="170" width="650" height="322" rx="14"/>
  <text class="box-h" x="1246" y="222">Application services</text>
  <text class="box-b" x="1246" y="260">typed async ports · no SQL or HTTP types inside</text>
  <text class="item" x="1246" y="312">Coordination</text>
  <text class="itemb" x="1246" y="344">claim · renew · release</text>
  <text class="item" x="1246" y="392">Memory + policy</text>
  <text class="itemb" x="1246" y="424">tentative cannot supersede</text>
  <text class="item" x="1580" y="312">Handoff</text>
  <text class="itemb" x="1580" y="344">checkpoint · complete</text>
  <text class="item" x="1580" y="392">Retrieval</text>
  <text class="itemb" x="1580" y="424">planner + lanes</text>
  <text class="itemb" x="1246" y="468">Evidence · Conflict · Extraction · Audit · DurableWork</text>

  <path class="arrow" d="M1545,492 L1545,554" marker-end="url(#ah)"/>

  <!-- CockroachDB -->
  <rect class="db" x="140" y="560" width="1640" height="250" rx="18"/>
  <text class="dbh" x="180" y="632">CockroachDB</text>
  <text class="itemb" x="180" y="674">one SERIALIZABLE brain</text>
  <text class="itemb" x="180" y="706">nothing edited in place</text>
  <text class="itemb" x="180" y="738">nothing destructively deleted</text>

  <rect x="640" y="618" width="12" height="12" fill="#3fb950"/>
  <text class="item" x="668" y="630">canonical memories</text>
  <text class="itemb" x="668" y="662">bitemporal · state · trust · lineage</text>
  <rect x="640" y="708" width="12" height="12" fill="#58a6ff"/>
  <text class="item" x="668" y="720">retrieval projections</text>
  <text class="itemb" x="668" y="752">search_tsv · gin_trgm_ops · exact terms</text>
  <rect x="1200" y="618" width="12" height="12" fill="#bc8cff"/>
  <text class="item" x="1228" y="630">retrieval_vectors_1024</text>
  <text class="itemb" x="1228" y="662">VECTOR(1024) · C-SPANN ANN index</text>
  <rect x="1200" y="708" width="12" height="12" fill="#d29922"/>
  <text class="item" x="1228" y="720">outbox + events</text>
  <text class="itemb" x="1228" y="752">outbox_work_items · swarm_events</text>

  <!-- worker arc -->
  <path class="arrow2" d="M690,810 L690,852" marker-end="url(#ag)"/>
  <text class="edgeg" x="712" y="840">claim leased work</text>

  <rect class="panel" x="430" y="858" width="520" height="170" rx="14"/>
  <text class="box-h" x="456" y="910">Durable worker</text>
  <text class="box-b mono" x="456" y="948">swarmbrain-worker</text>
  <text class="box-b" x="456" y="982">LeasedWorkWorker + EmbedMemoryHandler</text>
  <text class="box-b" x="456" y="1012">fenced — a lost lease cannot publish</text>

  <path class="arrow2" d="M950,943 L1074,943" marker-end="url(#ag)"/>

  <rect class="panel" x="1080" y="858" width="520" height="170" rx="14"/>
  <text class="box-h" x="1106" y="910">EmbeddingProvider</text>
  <text class="box-b" x="1106" y="950">Deterministic (local) — in use</text>
  <text class="box-b" x="1106" y="984">Bedrock Titan V2, 1024-dim —</text>
  <text class="box-b" x="1106" y="1014">live-verified 2026-08-16</text>

  <path class="arrow2" d="M1340,858 L1340,816" marker-end="url(#ag)"/>
  <text class="edgeg" x="1364" y="820">vector + projection + completion</text>
  <text class="edgeg" x="1364" y="848">in one fenced transaction</text>

  <text class="foot" x="50" y="1064">Diagram 1 of 2 · source: docs/submission/architecture.md §1 — identity is derived from the authenticated token, never from a tool argument</text>
</svg>
