  <line x1="50" y1="200" x2="930" y2="200" stroke="#30363d" stroke-width="2"/>

  <rect class="used" x="50" y="220" width="880" height="212" rx="14"/>
  <circle cx="102" cy="272" r="22" fill="#3fb950"/>
  <path class="tick" d="M92,272 L99,280 L113,263"/>
  <text class="name" x="142" y="272">Distributed Vector Indexing</text>
  <text class="stU" x="142" y="312">USED — IN THE REAL RECALL PATH</text>
  <text class="det" x="142" y="352">VECTOR(1024) · CREATE VECTOR INDEX · C-SPANN ANN</text>
  <text class="det" x="142" y="386">full seven-column equality prefix, one ANN tree per scope</text>
