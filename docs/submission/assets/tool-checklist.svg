  <text class="colh" x="990" y="182">AWS</text>
  <line x1="990" y1="200" x2="1870" y2="200" stroke="#30363d" stroke-width="2"/>

  <rect class="used" x="990" y="220" width="880" height="212" rx="14"/>
  <circle cx="1042" cy="272" r="22" fill="#3fb950"/>
  <path class="tick" d="M1032,272 L1039,280 L1053,263"/>
