  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="h1" x="50" y="72">Tools — what actually landed</text>
  <text class="h1s" x="50" y="114">A tick mark appears only where the repository can prove it. Everything else stays outlined and says so.</text>

