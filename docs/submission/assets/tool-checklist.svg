    .card   { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .used   { fill: #10201a; stroke: #3fb950; stroke-width: 3; }
    .plan   { fill: #14181f; stroke: #4a5058; stroke-width: 2; stroke-dasharray: 10 8; }
    text    { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .h1     { fill: #e6edf3; font-size: 50px; font-weight: 700; }
    .h1s    { fill: #8b949e; font-size: 28px; }
    .colh   { fill: #c9d1d9; font-size: 34px; font-weight: 700; letter-spacing: 2px; }
    .name   { fill: #e6edf3; font-size: 32px; font-weight: 600; }
    .nameP  { fill: #9aa4b0; font-size: 32px; font-weight: 600; }
    .stU    { fill: #3fb950; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .stP    { fill: #8b949e; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .det    { fill: #a9b4c0; font-size: 26px; }
    .detP   { fill: #7d8590; font-size: 26px; }
    .rule   { fill: #d29922; font-size: 28px; font-weight: 600; }
    .foot   { fill: #6e7681; font-size: 24px; }
    .tick   { stroke: #0d1117; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
