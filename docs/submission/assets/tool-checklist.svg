  <rect class="card" x="990" y="790" width="880" height="152" rx="14"/>
  <text class="rule" x="1022" y="842">No S3 bucket exists — and none is claimed.</text>
  <text class="detP" x="1022" y="882">The planned S3 artifact export was not built; its IAM grants were</text>
  <text class="detP" x="1022" y="916">deliberately dropped from the task role rather than left unexercised.</text>

  <text class="foot" x="50" y="1010">Source of every line: the Devpost submission text and the deployment record, governed by the integrity guard.</text>
  <text class="foot" x="50" y="1048">Status re-verified 2026-08-17. Re-check before the final take: a tick mark is deleted, not softened, if the item has not landed.</text>
</svg>
