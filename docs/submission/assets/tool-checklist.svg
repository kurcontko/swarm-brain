  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="h1" x="50" y="72">Tools — what actually landed</text>
  <text class="h1s" x="50" y="114">A tick mark appears only where the repository can prove it — a checked-in evidence artifact or the deployment record.</text>

  <!-- legend -->
  <circle cx="1418" cy="60" r="20" fill="#3fb950"/>
  <path class="tick" d="M1409,60 L1415,67 L1428,52"/>
  <text class="stU" x="1448" y="70">USED — WITH EVIDENCE</text>

