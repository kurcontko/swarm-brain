<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Tool checklist: CockroachDB Distributed Vector Indexing, Managed MCP Server (audited session), and ccloud CLI are used with evidence artifacts; Agent Skills are vendored hash-locked. AWS Bedrock called live 2026-08-16; ECS Fargate deployed and smoke-verified; Secrets Manager, CloudWatch, and IAM in use. No S3 bucket exists.">
  <title>Swarm Brain — tools used, with evidence</title>
  <style>
