  <text class="stU" x="142" y="542">USED — AUDITED SESSION CAPTURED</text>
  <text class="det" x="142" y="582">OAuth session · ANN EXPLAIN receipt · evidence/…-managed-mcp-inspection.json</text>

  <rect class="used" x="50" y="620" width="880" height="152" rx="14"/>
  <circle cx="102" cy="672" r="22" fill="#3fb950"/>
  <path class="tick" d="M92,672 L99,680 L113,663"/>
