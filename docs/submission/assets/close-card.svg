<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Closing card: Swarm Brain — many agent vendors, one durable CockroachDB brain. Coordination, memory, vectors, audit. Live demo linked from the Devpost submission, and repository at https://github.com/kurcontko/swarm-brain under the MIT license.">
  <title>Swarm Brain — close</title>
  <style>
    .bg    { fill: #0d1117; }
    .card  { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    text   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .name  { fill: #ffffff; font-size: 96px; font-weight: 800; letter-spacing: 1px; }
    .thesis{ fill: #e6edf3; font-size: 52px; font-weight: 600; }
    .pill  { fill: #21262d; stroke: #30363d; stroke-width: 2; }
    .pillt { fill: #a9b4c0; font-size: 34px; font-weight: 600; letter-spacing: 2px; }
    .dot   { fill: #3fb950; }
    .label { fill: #8b949e; font-size: 28px; letter-spacing: 3px; font-weight: 700; }
    .url   { fill: #58a6ff; font-size: 31px; }
    .lic   { fill: #8b949e; font-size: 32px; }
  </style>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="name" x="960" y="300" text-anchor="middle">Swarm Brain</text>
  <text class="thesis" x="960" y="404" text-anchor="middle">Many agent vendors. One durable CockroachDB brain.</text>

  <rect class="pill" x="360" y="470" width="270" height="76" rx="38"/>
  <text class="pillt" x="495" y="520" text-anchor="middle">COORDINATION</text>
  <rect class="pill" x="660" y="470" width="200" height="76" rx="38"/>
  <text class="pillt" x="760" y="520" text-anchor="middle">MEMORY</text>
  <rect class="pill" x="890" y="470" width="210" height="76" rx="38"/>
  <text class="pillt" x="995" y="520" text-anchor="middle">VECTORS</text>
  <rect class="pill" x="1130" y="470" width="170" height="76" rx="38"/>
  <text class="pillt" x="1215" y="520" text-anchor="middle">AUDIT</text>
  <rect class="pill" x="1330" y="470" width="230" height="76" rx="38"/>
  <text class="pillt" x="1445" y="520" text-anchor="middle">TELEMETRY</text>

  <rect class="card" x="260" y="630" width="1400" height="300" rx="16"/>
  <circle class="dot" cx="330" cy="712" r="10"/>
  <text class="label" x="360" y="700">LIVE DEMO — READ-ONLY CONSOLE</text>
  <text class="url mono" x="360" y="752">link in the Devpost submission</text>
  <text class="label" x="360" y="838">REPOSITORY</text>
  <text class="url mono" x="360" y="890">https://github.com/kurcontko/swarm-brain</text>
  <text class="lic" x="1560" y="890" text-anchor="end">MIT</text>
</svg>
